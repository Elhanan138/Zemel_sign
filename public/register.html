<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zemel Sign — Register</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/rtl.css" id="rtl-stylesheet" disabled>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="logo-block">
      <div class="logo-icon">✍</div>
      <h1 class="logo-title">Zemel Sign</h1>
      <p class="logo-sub" data-i18n="tagline">Bilingual Document Signing</p>
    </div>

    <div class="card auth-card">
      <div class="lang-toggle-row">
        <button class="btn-lang active" id="btn-en" onclick="setLang('en')">English</button>
        <button class="btn-lang" id="btn-he" onclick="setLang('he')">עברית</button>
      </div>

      <h2 data-i18n="register_title">Create Account</h2>

      <form id="registerForm">
        <div class="form-group">
          <label data-i18n="full_name">Full Name</label>
          <input type="text" id="name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label data-i18n="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label data-i18n="password">Password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div id="regError" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" data-i18n="register_btn">Create Account</button>
      </form>

      <p class="auth-link">
        <span data-i18n="have_account">Already have an account?</span>
        <a href="/login" data-i18n="login_link">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('regError');
      errEl.classList.add('hidden');
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      const lang = localStorage.getItem('lang') || 'en';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            language: lang
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
